name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -a index.html css js assets _site/
          if [ -d data ]; then cp -a data _site/data; fi
          touch _site/.nojekyll

      - name: Configurar o Pages
        uses: actions/configure-pages@v5
        with:
          # Cria o site Pages com source GitHub Actions se ainda não existir.
          enablement: true

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
